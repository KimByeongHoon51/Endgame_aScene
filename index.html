<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="bgm"><div class="t">♪ Get This Thing Started</div><div id="yt"></div><div id="ytNote"></div></div>
<script src="balance.js"></script>
<script>
'use strict';
// ───────── 기본 상수 ─────────
const CHASE=450,W=1280,H=720,GROUND=560,BASE_X=150,SHIP_X=1100,SPAWN_X=1125,STEP=1/60,INTRO_T=8.2;
const OUT='#1c1410',UI='Jua, sans-serif',LOGO='"Black Han Sans", Jua, sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();

const HASH=new URLSearchParams(location.hash.slice(1));
const DBG={stage:+HASH.get('stage')||0,sim:+HASH.get('sim')||0,bot:HASH.has('bot'),food:+HASH.get('food')||0,play:HASH.has('play'),god:HASH.has('god'),
  gauge:HASH.has('gauge'),help:HASH.has('help'),select:HASH.has('select'),nointro:HASH.has('nointro'),all:HASH.has('all')};

// ───────── 밸런스 (balance.js 기본값 + balance.html 저장값) ─────────
function mergeB(d,o){if(o==null)return d;if(Array.isArray(d))return d.map((x,i)=>mergeB(x,o[i]));if(d&&typeof d==='object'){const r={};for(const k in d)r[k]=mergeB(d[k],o[k]);return r}return typeof o===typeof d?o:d}
let BAL=window.BALANCE_DEFAULT,balCustom=false;
try{const s=localStorage.getItem('endgame_balance');if(s&&!HASH.has('nobal')){BAL=mergeB(BAL,JSON.parse(s));balCustom=true}}catch(e){}
// balance.html 전략 시뮬레이터가 숨은 프레임으로 부를 때(#simhost): 편집 중인 수치로 계산, 소리·저장 없음
const SIMHOST=HASH.has('simhost');
if(SIMHOST){DBG.sim=1;try{if(parent.SIM_BAL)BAL=mergeB(window.BALANCE_DEFAULT,parent.SIM_BAL)}catch(e){}}
// 그림·공격 방식은 코드에 고정, 수치는 밸런스 테이블에서
const VIS={hawkeye:{shot:'arrow'},thor:{},ironman:{shot:'beam',fly:1},warmachine:{shot:'gun'},hulk:{sc:1.5},spiderman:{shot:'web'},strange:{shot:'orb'},panther:{},wanda:{shot:'chaos'},
  outrider:{role:'mob'},chitauri:{role:'mob',shot:'bolt'},brute:{role:'mob',sc:1.45},
  cull:{role:'boss',sc:1.9},proxima:{role:'boss',sc:1.2},corvus:{role:'boss',sc:1.2},ebony:{role:'boss',sc:1.1,shot:'rock'},thanos:{role:'thanos',sc:2.4}};
const CAP={id:'cap',...BAL.cap};
const UNITS=BAL.units.map(u=>({...u,...VIS[u.id]}));
const FOES={};for(const k in BAL.foes)FOES[k]={id:k,...BAL.foes[k],...VIS[k]};
const STAGES=BAL.stages;
const ORDER=['cull','proxima','corvus','ebony'];
const SKILLS=[{id:'shield',name:'방패 던지기',key:'Q',cd:BAL.shield.cd},{id:'thunder',name:'묠니르 번개',key:'W',cd:BAL.thunder.cd},{id:'gaunt',name:'인피니티 건틀릿',key:'E'}];

// ───────── 유틸·저장 ─────────
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function pickW(pool){let s=0;for(const k in pool)s+=pool[k];let r=Math.random()*s;for(const k in pool){r-=pool[k];if(r<=0)return k}return Object.keys(pool)[0]}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){if(DBG.sim)return;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let cleared=lsGet('endgame_cleared',0);
// 스테이지 입장 시 이월되는 건틀릿 게이지 — gaugeAt[i] = i스테이지 시작 게이지 (재도전으로 게이지를 불릴 수 없게)
let gaugeAt=lsGet('endgame_gaugeAt',[0]);
let muted=lsGet('endgame_mute',false);

// ───────── 사운드 ─────────
let AC=null;const sfxLast={};
const VOICE=new Audio('Assemble.m4a');VOICE.preload='auto';
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,f2){const a=AC,o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}
function noise(d,v,fc){const a=AC,n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fc;g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start()}
function sfx(k){
  if(muted||!AC||DBG.sim)return;const now=performance.now();if(now-(sfxLast[k]||0)<60)return;sfxLast[k]=now;
  switch(k){
    case 'hit':noise(.08,.25,1800);break;
    case 'shoot':tone(900,.08,'triangle',.05,500);break;
    case 'beam':tone(1400,.12,'sawtooth',.04,700);break;
    case 'gun':noise(.04,.15,4000);break;
    case 'chaos':tone(300,.25,'sine',.06,900);break;
    case 'spawn':tone(520,.08,'square',.05,780);break;
    case 'no':tone(160,.12,'square',.05);break;
    case 'smash':noise(.25,.4,600);tone(90,.25,'sine',.2,40);break;
    case 'shield':tone(700,.3,'triangle',.07,1200);break;
    case 'whoosh':noise(.6,.12,1200);break;
    case 'catch':tone(120,.4,'sine',.18,60);noise(.3,.15,3000);break;
    case 'push':tone(200,.4,'sine',.12,600);noise(.3,.15,1500);break;
    case 'thunder':noise(.7,.5,2500);tone(60,.6,'sawtooth',.15,30);break;
    case 'snap':tone(2000,.05,'square',.08);setTimeout(()=>{if(AC)noise(1.2,.25,900)},120);break;
    case 'boom':noise(1,.6,500);tone(70,.8,'sine',.3,30);break;
    case 'clear':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>AC&&tone(f,.25,'square',.06),i*130));break;
    case 'unlock':[784,988,1175].forEach((f,i)=>setTimeout(()=>AC&&tone(f,.2,'triangle',.07),i*110));break;
    case 'over':[392,330,262].forEach((f,i)=>setTimeout(()=>AC&&tone(f,.35,'square',.06),i*220));break;
    case 'boss':tone(110,.6,'sawtooth',.1,80);break;
    case 'shatter':noise(.6,.35,5000);[1568,1319,1047].forEach((f,i)=>setTimeout(()=>AC&&tone(f,.2,'triangle',.06),i*90));break;
  }
}
function playVoice(){if(muted||DBG.sim)return;try{VOICE.currentTime=0;VOICE.play().catch(()=>{})}catch(e){}}
function stopVoice(){try{VOICE.pause()}catch(e){}}
// 배경음: 유튜브 임베드 플레이어로 재생 (파일을 내려받지 않음). 전투 중 재생, 인트로·일시정지 때 멈춤
const YT_ID='58CtyD10_rY';
let yt=null,ytReady=false,wantBgm=false;
window.onYouTubeIframeAPIReady=()=>{
  yt=new YT.Player('yt',{width:180,height:101,videoId:YT_ID,
    playerVars:{controls:1,loop:1,playlist:YT_ID,playsinline:1,rel:0},
    events:{
      onReady:()=>{ytReady=true;yt.setVolume(40);if(muted)yt.mute();if(wantBgm)yt.playVideo()},
      onStateChange:e=>{if(e.data===YT.PlayerState.ENDED){yt.seekTo(0);yt.playVideo()}},
      onError:()=>{document.getElementById('ytNote').textContent='배경음을 불러오지 못했어요.'+(location.protocol==='file:'?' 깃허브 페이지(웹 주소)에서는 정상 재생돼요.':'')}}});
};
if(DBG.sim)document.getElementById('bgm').remove();
else{const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';t.async=true;document.head.appendChild(t);
  if(location.protocol==='file:')document.getElementById('ytNote').textContent='로컬 파일로 열면 유튜브가 막힐 수 있어요. 깃허브 페이지에서는 정상 재생돼요.'}
function startBgm(){wantBgm=true;if(ytReady)yt.playVideo()}
function pauseBgm(){wantBgm=false;if(ytReady)yt.pauseVideo()}

// ───────── 그림 도구 (카툰: 굵은 외곽선) ─────────
function P(c){ctx.fillStyle=c;ctx.fill();ctx.stroke()}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2)}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function poly(pts){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath()}
function limb(x1,y1,x2,y2,w,c){const L=ctx.lineWidth;ctx.save();ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=OUT;ctx.lineWidth=w+L*2;ctx.stroke();ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke();ctx.restore()}
function line(x1,y1,x2,y2,c,w){ctx.save();ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke();ctx.restore()}
function star(x,y,r,c){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}ctx.closePath();ctx.fillStyle=c;ctx.fill()}
function hairTop(c,cut){const y=cut==null?-50:cut;ctx.beginPath();ctx.arc(1,-49,13.6,Math.PI*1.0,Math.PI*2.0);ctx.lineTo(14.6,y);ctx.lineTo(-12.6,y);ctx.closePath();P(c)}
function eyes(x,y,c){ctx.fillStyle=c||OUT;ell(x,y,1.7,2.6);ctx.fill();ell(x+5,y,1.6,2.5);ctx.fill()}
function glow(c,b){ctx.shadowColor=c;ctx.shadowBlur=b}
function txt(s,x,y,size,col,align,font,sw){ctx.font=`${size}px ${font||UI}`;ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.lineJoin='round';
  if(sw!==0){ctx.strokeStyle=OUT;ctx.lineWidth=sw||Math.max(3,size/5);ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function mjolnir(x,y,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.lineWidth=2.4;ctx.strokeStyle=OUT;limb(0,0,0,16,3.4,'#8a5a32');rr(-10,-9,20,11,2);P('#9aa3ad');ctx.restore()}

// 공통 인체: 머리 큰 2.5등신
function Hm(c,sw,at,o){
  o=o||{};const tw=o.tw||22,aw=o.aw||6,lw=o.lw||7;
  if(o.back)o.back();
  limb(-4,-30,-9-sw*.6,-15,aw,c.arm);
  limb(-4,-13,-4+sw,-2,lw,c.bot);limb(4,-13,4-sw,-2,lw,c.bot);
  ell(-3+sw,-1,5.5,3);P(c.boot);ell(5-sw,-1,5.5,3);P(c.boot);
  rr(-tw/2,-38,tw,26,8);P(c.top);
  if(o.chest)o.chest();
  circ(1,-49,13);P(c.skin);
  if(o.head)o.head();
  const hx=o.raise?17:10+at*10,hy=o.raise?-68:-22-at*8;
  limb(o.raise?8:4,-32,hx,hy,aw,c.arm);
  if(c.glove){circ(hx,hy,aw*.62);P(c.glove)}
  if(o.front)o.front(hx,hy);
}

// ───────── 캐릭터 그림 ─────────
const CH={
 cap(sw,at,a,o){
  Hm({top:'#2d58b8',bot:'#2d58b8',boot:'#7b4a25',arm:'#2d58b8',glove:o.gaunt?'#e2b33a':'#7b4a25',skin:'#f2c79f'},sw,at,{raise:o.raise,
   chest(){star(0,-27,5.5,'#fff');rr(-11,-17,22,4,1);P('#7b4a25');ctx.fillStyle='#d3242b';ctx.fillRect(-10,-22,20,3)},
   head(){hairTop('#2d58b8',-50);ctx.save();ctx.lineWidth=2.2;ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(-1,-52);ctx.lineTo(2,-60);ctx.lineTo(5,-52);ctx.moveTo(0.2,-55);ctx.lineTo(3.8,-55);ctx.stroke();ctx.restore();
     ctx.fillStyle='#fff';poly([-9,-55,-15,-58,-13,-52]);ctx.fill();eyes(6,-46);if(o.shout){ell(9,-40,2.6,2.2);ctx.fillStyle=OUT;ctx.fill()}},
   front(hx,hy){
     if(o.raise){if(!o.noHammer){limb(hx,hy,hx,hy-14,3,'#8a5a32');rr(hx-9,hy-24,18,11,2);P('#9aa3ad')}return}
     if(o.gaunt){['#c43','#fc3','#36f','#3c6','#f80','#a3f'].forEach((col,i)=>{circ(hx-3+i%3*3,hy-2+(i>2?3:0),1.3);ctx.fillStyle=col;ctx.fill()});return}
     if(o.noShield)return;
     const sx=hx+3,sy=hy;circ(sx,sy,11);P('#d3242b');circ(sx,sy,8);P('#eee');circ(sx,sy,5.4);P('#d3242b');circ(sx,sy,3.6);P('#2d58b8');star(sx,sy,3,'#fff')}});
 },
 hawkeye(sw,at){
  Hm({top:'#3d2f52',bot:'#26242e',boot:'#1c1b22',arm:'#3d2f52',glove:'#1c1b22',skin:'#eec29b'},sw,at,{
   back(){rr(-14,-44,6,22,2);P('#5b3a2a');line(-12,-46,-14,-52,'#ddd',2);line(-10,-46,-9,-53,'#ddd',2)},
   chest(){line(-9,-36,9,-14,OUT,3)},
   head(){hairTop('#3a2a22',-52);eyes(6,-47)},
   front(hx,hy){ctx.save();ctx.beginPath();ctx.arc(hx-8,hy,18,-1.15,1.15);ctx.strokeStyle=OUT;ctx.lineWidth=6;ctx.stroke();ctx.strokeStyle='#6b3fa0';ctx.lineWidth=3.5;ctx.stroke();
     ctx.beginPath();ctx.moveTo(hx-8+Math.cos(-1.15)*18,hy+Math.sin(-1.15)*18);ctx.lineTo(hx-4-at*6,hy);ctx.lineTo(hx-8+Math.cos(1.15)*18,hy+Math.sin(1.15)*18);ctx.strokeStyle='#ddd';ctx.lineWidth=1;ctx.stroke();ctx.restore()}});
 },
 thor(sw,at,a){
  Hm({top:'#5b6672',bot:'#2f3338',boot:'#2f3338',arm:'#2f3338',glove:'#2f3338',skin:'#f0c39d'},sw,at,{
   back(){poly([-9,-38,-24+sw*.4,-4,-2,-8]);P('#b3202a');ell(-3,-45,13,15);P('#e8c25a')},
   chest(){circ(-4,-30,2.6);P('#d9dde2');circ(4,-30,2.6);P('#d9dde2');circ(0,-21,2.6);P('#d9dde2')},
   head(){hairTop('#e8c25a',-51);ctx.beginPath();ctx.arc(3,-44,9,0.15*Math.PI,0.85*Math.PI);ctx.closePath();P('#d9b04a');eyes(6,-48,at>0?'#7fd8ff':OUT)},
   front(hx,hy){limb(hx-1,hy+12,hx+2,hy-18,3,'#8a5a32');poly([hx+2,hy-18,hx+14,hy-24,hx+16,hy-12,hx+3,hy-11]);P('#b8c2cc');
     if(at>0){ctx.save();glow('#7fd8ff',8);line(hx+10,hy-24,hx+18,hy-34,'#cfefff',2);line(hx+14,hy-14,hx+24,hy-10,'#cfefff',2);ctx.restore()}}});
 },
 ironman(sw,at,a,o){
  Hm({top:'#c4222b',bot:'#c4222b',boot:'#e2b33a',arm:'#c4222b',glove:'#e2b33a',skin:'#c4222b'},sw*.3,at,{raise:o&&o.raise,
   back(){ctx.save();glow('#ffb347',10);for(const fx of[-3,5]){ell(fx,6,3,6+Math.sin(a*30+fx)*2);ctx.fillStyle='#ffd27a';ctx.fill()}ctx.restore()},
   chest(){ctx.save();glow('#9ff',10);circ(0,-29,4);P('#d9ffff');ctx.restore();rr(-11,-17,22,4,1);P('#e2b33a')},
   head(){rr(2,-56,13,16,5);P('#e2b33a');ctx.fillStyle='#dffaff';ctx.fillRect(5,-51,4,1.8);ctx.fillRect(10,-51,4,1.8)},
   front(hx,hy){if(o&&o.gaunt){ctx.save();circ(hx,hy,5.5);P('#e2b33a');['#c43','#fc3','#36f','#3c6','#f80','#a3f'].forEach((c,i)=>{glow(c,6);circ(hx-3+i%3*3,hy-1.5+(i>2?3:0),1.2);ctx.fillStyle=c;ctx.fill()});ctx.restore();return}
     if(at>0){ctx.save();glow('#9ff',14);circ(hx+3,hy,4);ctx.fillStyle='#fff';ctx.fill();ctx.restore()}}});
 },
 warmachine(sw,at){
  Hm({top:'#5e656c',bot:'#3f444a',boot:'#2b2e32',arm:'#5e656c',glove:'#2b2e32',skin:'#5e656c'},sw,at,{lw:8,tw:25,
   back(){rr(-12,-50,24,7,2);P('#2b2e32');rr(10,-49,10,2.5,1);P('#555')},
   chest(){circ(0,-29,3.5);P('#cfe');rr(-12,-17,24,4,1);P('#2b2e32')},
   head(){rr(3,-55,11,15,4);P('#b9c0c6');ctx.fillStyle='#fff';ctx.fillRect(5,-50,7,1.8)},
   front(hx,hy){rr(hx-2,hy-4,16,7,2);P('#2b2e32');if(at>0){ctx.save();glow('#ff0',10);circ(hx+16,hy,3);ctx.fillStyle='#ffe066';ctx.fill();ctx.restore()}}});
 },
 hulk(sw,at){
  Hm({top:'#5fae3e',bot:'#5b3a88',boot:'#5fae3e',arm:'#5fae3e',glove:'#5fae3e',skin:'#5fae3e'},sw,at,{tw:30,aw:10,lw:9,
   chest(){ctx.beginPath();ctx.moveTo(-8,-28);ctx.quadraticCurveTo(-3,-24,0,-28);ctx.quadraticCurveTo(3,-24,8,-28);ctx.stroke();poly([-15,-14,15,-14,13,-10,-13,-10]);P('#5b3a88')},
   head(){hairTop('#1b1b1b',-53);line(4,-52,9,-50,OUT,2.5);line(10,-50,15,-52,OUT,2.5);eyes(6,-47);line(6,-41,13,-41,OUT,2)},
   front(hx,hy){circ(hx,hy,7);P('#5fae3e')}});
 },
 spiderman(sw,at){
  Hm({top:'#d4292b',bot:'#2b4fb8',boot:'#d4292b',arm:'#d4292b',glove:'#d4292b',skin:'#d4292b'},sw,at,{
   chest(){ctx.fillStyle=OUT;ell(0,-27,2.2,3.4);ctx.fill();for(const d of[-1,1]){line(0,-28,d*5,-32,OUT,1);line(0,-26,d*5,-22,OUT,1)}rr(-11,-17,22,5,1);P('#2b4fb8')},
   head(){ctx.save();ctx.lineWidth=.6;ctx.strokeStyle='#7a1112';for(let i=0;i<6;i++){const an=i*Math.PI/3;ctx.beginPath();ctx.moveTo(4,-48);ctx.lineTo(4+Math.cos(an)*13,-48+Math.sin(an)*13);ctx.stroke()}ctx.restore();
     ell(6,-50,3.6,5.2,-.3);P('#fff');ell(12.5,-50,3,4.6,.3);P('#fff')}});
 },
 strange(sw,at,a){
  Hm({top:'#253b7a',bot:'#253b7a',boot:'#3a2a22',arm:'#253b7a',glove:'#c9a074',skin:'#eec29b'},sw,at,{
   back(){poly([-10,-40,-22+sw*.3,-3,6,-6,6,-38]);P('#b3202a')},
   chest(){rr(-12,-20,24,15,5);P('#253b7a');rr(-11,-19,22,4,1);P('#6b4a2a');ctx.save();glow('#3f6',6);circ(0,-31,2.6);P('#e8c25a');ctx.restore()},

function tY(e){if(e.struct)return e.ship?330:420;return e.y-30*(e.def.sc||1)-(e.def.fly?18:0)}

const isBoss=e=>e.def.role==='boss'||e.def.role==='thanos';

function dmg(e,n,src){
  if(e.dead||G.end>0)return;
  if(DBG.god&&e.side==='A'&&!e.ship)return;
  if(e.ship&&G.shieldOn){n*=1-BAL.boss.shieldPct/100;G.shieldHit=.15}
  e.hp-=n;e.hit=.1;if(e.hero)e.regenT=3;
  if(e.hp<=0){
    e.hp=0;
    if(e.ship){finish('clear',true);return}
    if(e.struct){finish('over');return}
    if(e===G.thanos){startEnding();return}
    kill(e);
  }
}

  e.dead=1;e.deadT=.5;

// ───────── 전투 ─────────
function findTarget(u){
  const dir=u.side==='A'?1:-1,foes=u.side==='A'?G.enemies:G.allies;
  let best=null,bd=1e9;
  // 적 우선: ① 앞쪽 사거리 안 적 ② 뒤쪽 사거리 안 적 ③ 그래도 없을 때만 군함·건물
  for(const e of foes){if(e.dead||e.wait>0&&e.side==='T'&&e.def.role==='thanos')continue;const d=(e.x-u.x)*dir;if(d<-20||d>u.def.range+reach(e))continue;if(d<bd){bd=d;best=e}}
  if(best)return best;
  for(const e of foes){if(e.dead||e.wait>0)continue;const d=(u.x-e.x)*dir;if(d<=20||d>u.def.range+reach(e))continue;if(d<bd){bd=d;best=e}}
  if(best)return best;
  if(u.side==='A'){if(G.ship&&!G.ship.gone&&SHIP_X-u.x<=u.def.range+8)return G.ship}
  else if(u.x-BASE_X<=u.def.range+8)return G.base;
  return null;
}
function foesInRange(u){const dir=u.side==='A'?1:-1,foes=u.side==='A'?G.enemies:G.allies;return foes.filter(e=>!e.dead&&(e.x-u.x)*dir>=-20&&(e.x-u.x)*dir<=u.def.range+reach(e)).sort((a,b)=>(a.x-u.x)*dir-(b.x-u.x)*dir)}
function aoe(side,x,r,n,src){for(const e of(side==='A'?G.enemies:G.allies))if(!e.dead&&Math.abs(e.x-x)<=r+reach(e))dmg(e,n,src)}
function attack(u,t){
  const d=u.def,dir=u.face||(u.side==='A'?1:-1),sc=d.sc||1;u.atkT=.3;
  const hx=u.x+dir*16*sc,hy=u.y-(d.fly?44:28)*sc;
  if(d.multi){const list=foesInRange(u).slice(0,d.multi);if(!list.length)list.push(t);
    for(const e of list){dmg(e,d.atk,u);G.fx.push({k:'beam',x1:hx,y1:hy,x2:e.x,y2:tY(e),c:'#ff2d55',w:6,t:.3,T:.3})}sfx('chaos');return}
  switch(d.shot){
    case 'beam':dmg(t,d.atk,u);G.fx.push({k:'beam',x1:hx,y1:hy,x2:t.x,y2:tY(t),c:'#9ff',w:4,t:.15,T:.15});sfx('beam');break;
    case 'gun':dmg(t,d.atk,u);G.fx.push({k:'beam',x1:hx,y1:hy+4,x2:t.x+rnd(-6,6),y2:tY(t)+rnd(-8,8),c:'#ffe066',w:2,t:.08,T:.08});sfx('gun');break;
    case 'arrow':case 'web':case 'orb':case 'bolt':case 'rock':
      G.projs.push({k:d.shot,x:hx,y:hy,tg:t,tx:t.x,ty:tY(t),spd:d.shot==='arrow'?720:d.shot==='bolt'?520:420,dmg:d.atk,aoe:d.aoe||0,slow:d.slow||0,side:u.side,src:u,ang:0});sfx('shoot');break;
    default:
      if(d.aoe){aoe(u.side,t.x,d.aoe,d.atk,u);if(t.struct)dmg(t,d.atk,u);G.fx.push({k:'smash',x:t.x,y:GROUND,r:d.aoe,t:.35,T:.35});
        if(d.id==='hulk'&&Math.random()<.35)pop('SMASH!',t.x,u.y-110,'#7dff5a',30);if(d.id==='thanos'||d.id==='cull')G.shake=Math.max(G.shake,.25);sfx('smash')}
      else{dmg(t,d.atk,u);G.fx.push({k:'slash',x:t.x-dir*4,y:tY(t),t:.18,T:.18,c:d.id==='thor'?'#8fd8ff':d.id==='panther'?'#c9a9ff':'#fff',dir});sfx('hit')}
      if(d.id==='thor')G.fx.push({k:'bolt',x:t.x,y:tY(t),t:.2,T:.2,short:1});
  }
}
// 에보니 모 염력: 앞쪽 아군을 뒤로 날려버림
// 프록시마·코르버스 창 던지기: 앞쪽 일직선을 관통해 맞은 아군마다 최대 체력의 throwPct% 피해 (체력 높은 탱커일수록 아픔, 뒤의 원거리까지 닿음)
function spearThrow(u,dt){
  const d=u.def;u.throwT-=dt;if(u.throwT>0)return;
  if(!G.allies.some(a=>!a.dead&&u.x-a.x>=-20&&u.x-a.x<=d.throwRange))return;
  u.throwT=d.throwCd;u.atkT=.5;sfx('whoosh');pop('창 던지기!',u.x,u.y-120,'#ffcf3a',28);
  G.projs.push({k:'spear',x:u.x-20,y:u.y-46*(d.sc||1),dir:-1,dist:0,range:d.throwRange,pct:d.throwPct,hit:new Set(),src:u,ang:Math.PI});
}
function ebonyPush(u,dt){
  const d=u.def;u.pushT-=dt;if(u.pushT>0)return;
  const hit=G.allies.filter(a=>!a.dead&&u.x-a.x>=-20&&u.x-a.x<=d.pushRange);if(!hit.length)return;
  u.pushT=d.pushCd;u.atkT=.5;sfx('push');pop('염력!',u.x,u.y-110,'#9fd8ff',28);
  G.fx.push({k:'wave',x:u.x,y:u.y-40,r:d.pushRange,t:.5,T:.5});
  for(const a of hit){a.x=Math.max(BASE_X+20,a.x-d.push);a.stun=Math.max(a.stun,.5);a.hit=.15}
}
function unitAI(u,dt){
  u.anim+=dt;u.hit=Math.max(0,u.hit-dt);u.atkT=Math.max(0,u.atkT-dt);u.slow=Math.max(0,u.slow-dt);
  if(u.wait>0){u.wait-=dt;return}
  if(u.stun>0){u.stun-=dt;u.walk=0;return}
  if(u.def.throwCd)spearThrow(u,dt); // 걸어 나오는 중에도 던짐
  if(u.side==='T'&&u.x>SHIP_X-40){u.walk=1;u.face=-1;u.x-=u.def.spd*(u.slow>0?.5:1)*dt;return}
  if(u.def.pushCd)ebonyPush(u,dt);
  u.cd-=dt;
  let t=findTarget(u),dir=u.side==='A'?1:-1;
  // 아군: 군함만 때릴 상황인데 뒤로 지나간 적이 있으면 군함 대신 그 적에게 돌아감
  // 방어막이 켜져 있으면 거리 제한 없이, 꺼져 있으면 CHASE 안쪽 적만 쫓아감
  if(u.side==='A'&&(!t||t.struct)){let bd=G.shieldOn?1e9:CHASE,c=null;for(const e of G.enemies){if(e.dead||e.wait>0)continue;const d=u.x-e.x;if(d>20&&d<bd){bd=d;c=e}}if(c){t=null;dir=-1}}
  u.face=t?(Math.sign(t.x-u.x)||dir):dir;if(t&&t.struct)u.face=u.side==='A'?1:-1;
  if(t){u.walk=0;if(u.cd<=0){u.cd=u.def.rate;attack(u,t)}}
  else{u.walk=1;u.x+=dir*u.def.spd*(u.slow>0?.5:1)*dt;u.x=u.side==='A'?Math.min(u.x,SHIP_X-12):Math.max(u.x,BASE_X+12);if((u.side==='A'&&u.x>=SHIP_X-12)||(u.side==='T'&&u.x<=BASE_X+12))u.walk=0}
}

// ───────── 갱신 ─────────
function updateIntro(dt){
  const c=G.cap,e0=INTRO_T-G.intro;
  if(!muted&&!VOICE.paused&&VOICE.currentTime>0)G.intro=Math.max(0,INTRO_T-VOICE.currentTime);
  else if(!muted&&!VOICE.paused&&(G.introWait=(G.introWait||0)+dt)<1.5){}
  else G.intro=Math.max(0,G.intro-dt);
  const e=INTRO_T-G.intro;
  c.anim+=dt;c.raiseT=e>=6?1:0;
  if(e0<5&&e>=5)sfx('whoosh');
  if(e0<6&&e>=6){sfx('catch');G.flash=.35;G.shake=.4;for(let i=0;i<4;i++)G.fx.push({k:'bolt',x:c.x+rnd(-60,60),y:c.y-rnd(0,40),t:.5,T:.5})}
  if(e>=6&&Math.random()<dt*8)G.fx.push({k:'bolt',x:c.x+rnd(-50,50),y:c.y-rnd(20,90),t:.3,T:.3,short:1});
  updateFx(dt);
  if(G.intro<=0){c.raiseT=0;G.banner=2.8;startBgm()}
}
function update(dt){
  if(G.intro>0){updateIntro(dt);return}
  if(G.ending){updateEnding(dt);return}
  G.t+=dt;
  G.food=Math.min(G.foodMax,G.food+G.foodRate*dt);G.inc.pass+=G.foodRate*dt;
  for(const k in G.skill)G.skill[k]=Math.max(0,G.skill[k]-dt);
  for(let i=0;i<G.ucd.length;i++)G.ucd[i]=Math.max(0,G.ucd[i]-dt);
  G.banner=Math.max(0,G.banner-dt);G.beam=Math.max(0,G.beam-dt*2);
  if(DBG.bot)bot(dt);
  // 캡틴
  const c=G.cap;c.anim+=dt;c.hit=Math.max(0,c.hit-dt);c.atkT=Math.max(0,c.atkT-dt);c.raiseT=Math.max(0,(c.raiseT||0)-dt);c.gauntT=Math.max(0,(c.gauntT||0)-dt);
  if(c.dead){c.reviveT-=dt;if(c.reviveT<=0){c.dead=0;c.hp=c.max;c.x=BASE_X+40;c.stun=0;c.hit=0;pop('부활!',c.x,c.y-110,'#9cc8ff',28)}}
  if(!c.dead){
    let mv=(keys.left||keys.pl?-1:0)+(keys.right||keys.pr?1:0);if(DBG.bot)mv=G.botMv||0;if(c.stun>0){c.stun-=dt;mv=0}
    c.x=clamp(c.x+mv*CAP.spd*dt,BASE_X+20,SHIP_X-80);c.walk=mv!==0;if(mv)c.face=mv;
    c.cd-=dt;let t=null,bd=1e9;
    for(const e of G.enemies){if(e.dead)continue;const d=Math.abs(e.x-c.x);if(d<CAP.range+reach(e)&&d<bd){bd=d;t=e}}
    if(t){if(!c.walk)c.face=Math.sign(t.x-c.x)||1;if(c.cd<=0){c.cd=CAP.rate;c.atkT=.3;dmg(t,CAP.atk,c);G.fx.push({k:'slash',x:t.x,y:tY(t),t:.18,T:.18,c:'#fff',dir:c.face});sfx('hit')}}
    c.regenT-=dt;if(c.regenT<=0)c.hp=Math.min(c.max,c.hp+CAP.regen*dt);
  }
  // 잡몹 생성 (스테이지 배율 mob만큼 자주)
  const st=G.st;
  G.spawnT-=dt;
  if(G.spawnT<=0){const p=clamp(G.t/120,0,1);G.spawnT=lerp(st.int0,st.int1,p)/st.mob;const n=1+(Math.random()<p*.6?1:0)+(Math.random()<p*.25?1:0);for(let i=0;i<n;i++)spawnFoe(pickW(G.pool))}
  while(G.queue.length&&G.t>=G.queue[0].at)spawnFoe(G.queue.shift().type);
  // 보스
  if(G.final){
    const gap=BAL.final.orderGap;
    // FINAL 블랙 오더는 체력 orderHp%로 출격 (S2~S4 보스전용 체력과 따로 조절)
    while(G.orderN<ORDER.length&&G.t>=st.bossTime+G.orderN*gap){const o=spawnFoe(ORDER[G.orderN],true);o.max=o.hp=Math.round(o.hp*BAL.final.orderHp/100);G.order.push(o);G.orderN++}
    if(G.orderN===ORDER.length&&!G.thanos&&G.order.every(e=>e.dead))spawnThanos();
  }else if(!G.bossOut&&(G.t>=st.bossTime||G.ship.hp/G.ship.max*100<=st.bossShip)){G.bossOut=1;G.boss=spawnFoe(st.boss,true)}
  // 타노스
  const th=G.thanos,TB=BAL.foes.thanos;
  if(th&&!th.dead&&!(th.wait>0)){th.slamT-=dt;
    if(th.slamT<=0&&G.allies.some(a=>!a.dead&&th.x-a.x<TB.slamRange&&th.x-a.x>-40)){th.slamT=TB.slamCd;th.atkT=.5;G.shake=.6;sfx('smash');pop('쿠웅!',th.x-60,th.y-180,'#d9b3ff',34);
      G.fx.push({k:'smash',x:th.x-90,y:GROUND,r:TB.slamRange*.8,t:.5,T:.5});
      for(const a of G.allies){if(a.dead)continue;const d=th.x-a.x;if(d<TB.slamRange&&d>-40){dmg(a,TB.slamDmg,th);a.x=Math.max(BASE_X+20,a.x-TB.slamPush);a.stun=Math.max(a.stun,.6)}}}
    if(!th.half&&th.hp<th.max/2){th.half=1;say(th,'내가 직접 끝내주마.',2.4);for(let i=0;i<4;i++)spawnFoe('outrider')}}
  for(const u of G.allies)if(!u.hero&&!u.dead)unitAI(u,dt);
  for(const u of G.enemies)if(!u.dead)unitAI(u,dt);
  for(const s of[G.base,G.ship])if(s)s.hit=Math.max(0,s.hit-dt);
  updateProjs(dt);updateFx(dt);
  G.allies=G.allies.filter(u=>u.hero||!u.dead||u.deadT>0);G.enemies=G.enemies.filter(u=>!u.dead||u.deadT>0);
}
function updateProjs(dt){
  const S=BAL.shield;
  for(const p of G.projs){
    if(p.k==='spear'){const s=760*dt;p.x+=p.dir*s;p.dist+=s;
      for(const a of G.allies)if(!a.dead&&!p.hit.has(a)&&Math.abs(a.x-p.x)<16+reach(a)){p.hit.add(a);dmg(a,a.max*p.pct/100,p.src);a.stun=Math.max(a.stun,.3);G.fx.push({k:'slash',x:a.x,y:tY(a),t:.2,T:.2,c:'#ffcf3a',dir:-1})}
      if(p.dist>=p.range||p.x<BASE_X)p.done=1;continue}
    if(p.k==='shield'){const c=G.cap;p.ang+=dt*20;
      if(!p.ret){p.x+=p.dir*680*dt;p.dist+=680*dt;if(p.dist>=S.dist||p.x>=SHIP_X-10||p.x<=BASE_X){p.ret=1;p.hitSet.clear();if(G.ship&&p.x>=SHIP_X-10)dmg(G.ship,S.dmg,c)}}
      else{const dx=c.x-p.x,dy=(c.y-26)-p.y,L=Math.hypot(dx,dy);if(L<24||c.dead){p.done=1;c.shieldOut=0;continue}p.x+=dx/L*760*dt;p.y+=dy/L*760*dt}
      for(const e of G.enemies)if(!e.dead&&!p.hitSet.has(e)&&Math.abs(e.x-p.x)<26+reach(e)){p.hitSet.add(e);dmg(e,S.dmg,c);G.fx.push({k:'slash',x:e.x,y:tY(e),t:.15,T:.15,c:'#9cc8ff',dir:1})}
      continue}
    if(p.tg&&!p.tg.dead){p.tx=p.tg.x;p.ty=tY(p.tg)}
    const dx=p.tx-p.x,dy=p.ty-p.y,L=Math.hypot(dx,dy),s=p.spd*dt;p.ang=p.k==='rock'?p.ang+dt*10:Math.atan2(dy,dx);

    }else{p.x+=dx/L*s;p.y+=dy/L*s}

}

let SIM_STRAT=null;
function stratUnits(S,si){
  const av=UNITS.map((u,i)=>i).filter(i=>isUnlocked(UNITS[i],si)),byCost=[...av].sort((a,b)=>UNITS[a].cost-UNITS[b].cost);
  switch(S.kind){

}
// 물량형(cheap·W·R)은 살 수 있는 것 중 가장 비싼 것부터, 저축형(rich·custom)은 목록 순서대로 식량을 모아서 생산

    for(let k=0;k<list.length;k++){const i=list[G.sCyc%list.length];if(G.ucd[i]>0){G.sCyc++;continue}if(G.food>=UNITS[i].cost){G.sCyc++;return i}return null}
    return null}
  const ok=list.filter(i=>G.ucd[i]<=0&&G.food>=UNITS[i].cost).sort((a,b)=>UNITS[b].cost-UNITS[a].cost);return ok.length?ok[0]:null;
}

  let tx=clamp(front-150,220,600);if(c.hp<c.max*.5||G.enemies.some(e=>!e.dead&&isBoss(e)&&e.x-c.x<260))tx=Math.max(200,c.x-200);G.botMv=Math.abs(tx-c.x)<10?0:Math.sign(tx-c.x);

let last=performance.now(),acc=0;
function frame(now){
  const d=Math.min(.1,(now-last)/1000);last=now;uiT+=d;
  if(STATE==='result'&&G)G.resT+=d;
  if((STATE==='play'||STATE==='result')&&!paused&&!help&&G){acc+=d;while(acc>=STEP){if(STATE==='play')step(STEP);else updateFx(STEP);acc-=STEP}}else acc=0;
  render();requestAnimationFrame(frame);
}
// 디버그 해시: #play #stage=N #sim=초 #bot #god #food=N #gauge #help #select #nointro #all #nobal
if(DBG.select)STATE='select';
if(DBG.play||DBG.stage)newGame(clamp((DBG.stage||1)-1,0,4));
if(DBG.help)help=true;
if(DBG.sim&&G){let n=0;while(G.t<DBG.sim&&STATE==='play'&&n<DBG.sim*60+2000){step(STEP);n++}
  document.title='SIM '+STATE+' '+(G.result||'')+' t='+G.t.toFixed(1)+' kills='+G.kills+' base='+Math.ceil(G.base.hp)+' gauge='+G.gauge.toFixed(1)}
requestAnimationFrame(frame);
</script>
</body>
